<div class="crm">
  <div #mapContainer class="crm-canvas"></div>

  @if (mapUnavailable()) {
    <div class="crm-fallback">{{ 'maps.unavailable' | translate }}</div>
  }

  @if (signals().length === 0) {
    <span class="crm-empty">{{ 'maps.noNearbySignals' | translate }}</span>
  }

  <div class="crm-legend">
    <span><i class="dot dot--high"></i> {{ 'maps.high' | translate }}</span>
    <span><i class="dot dot--medium"></i> {{ 'maps.medium' | translate }}</span>
    <span><i class="dot dot--low"></i> {{ 'maps.low' | translate }}</span>
  </div>
</div>
