<div class="sm">
  <div #mapContainer class="sm-canvas"></div>

  @if (mapUnavailable()) {
    <div class="sm-fallback">{{ 'maps.unavailable' | translate }}</div>
  }

  @if (markers().length === 0) {
    <span class="sm-empty">{{ 'maps.noRiskSignals' | translate }}</span>
  }

  <div class="sm-legend">
    <span><i class="dot dot--high"></i> {{ 'maps.high' | translate }}</span>
    <span><i class="dot dot--medium"></i> {{ 'maps.medium' | translate }}</span>
    <span><i class="dot dot--low"></i> {{ 'maps.low' | translate }}</span>
  </div>
</div>
