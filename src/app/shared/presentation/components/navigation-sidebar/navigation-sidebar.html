<aside class="dashboard-sidebar" [class.is-collapsed]="collapsed">
  <!-- Collapse Trigger -->
  <button class="collapse-button" type="button" (click)="toggleSidebar()">
    <span class="pi" [class]="collapsed ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"></span>
  </button>

  <!-- Brand Section -->
  <div class="sidebar-brand">
    <img src="/assets/icons/dashboard/viora-isotipo-green.png" alt="Viora Logo" class="brand-logo" />
    @if (!collapsed) {
      <strong>VIORA</strong>
    }
  </div>

  <!-- Main Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-group">
      @for (item of mainItems; track item.route) {
        <a
          [routerLink]="item.route"
          class="nav-item"
          [class.is-active]="isRouteActive(item.route)"
        >
          <div class="nav-icon" [ngStyle]="getIconStyle(item.iconPath)"></div>
          @if (!collapsed) {
            <span class="nav-label">{{ item.label | translate }}</span>
          }
        </a>
      }
    </div>

    <!-- Secondary Items (Settings, etc.) -->
    <div class="nav-group secondary">
      @for (item of secondaryItems; track item.route) {
        <a
          [routerLink]="item.route"
          class="nav-item"
          [class.is-active]="isRouteActive(item.route)"
        >
          <div class="nav-icon" [ngStyle]="getIconStyle(item.iconPath)"></div>
          @if (!collapsed) {
            <span class="nav-label">{{ item.label | translate }}</span>
          }
        </a>
      }
    </div>
  </nav>

  <!-- User Section -->
  <div class="sidebar-user">
    <div class="user-avatar-placeholder">
      <i class="pi pi-user"></i>
    </div>
    @if (!collapsed) {
      <div class="user-info">
        <strong>Jane Doe</strong>
        <span>Producer</span>
      </div>
      <a routerLink="/profile" class="user-action">
        <i class="pi pi-ellipsis-v"></i>
      </a>
    }
  </div>
</aside>
