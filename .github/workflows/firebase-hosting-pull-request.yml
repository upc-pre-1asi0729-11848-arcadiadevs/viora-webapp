name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          node -e "const fs=require('fs');const p='src/environments/environment.ts';const token=process.env.MAPBOX_ACCESS_TOKEN;if(!token)throw new Error('MAPBOX_ACCESS_TOKEN is not configured');const source=fs.readFileSync(p,'utf8');if(!source.includes('YOUR_MAPBOX_TOKEN:HERE'))throw new Error('Mapbox token placeholder not found');fs.writeFileSync(p,source.replace('YOUR_MAPBOX_TOKEN:HERE',token));"
          npm ci
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIORA_WEBAPP }}
          projectId: viora-webapp
